name: MarcoRojo
options:
  bundleIdPrefix: cl.vallejos
  deploymentTarget:
    iOS: "16.4"
targets:
  MarcoRojo:
    type: application
    platform: iOS
    sources:
      - MarcoRojo
    info:
      path: MarcoRojo/Info.plist
      properties:
        CFBundleDisplayName: Marco Rojo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryAddUsageDescription: Para guardar tus fotos con marco.
        NSPhotoLibraryUsageDescription: Para guardar tus fotos con marco.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.vallejos.marcorojo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
